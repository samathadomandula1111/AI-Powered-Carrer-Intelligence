



<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Intelligence | Login</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #dff4ff, #a8dcff);
            font-family: Arial, sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 35px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 12px 35px rgba(48, 132, 190, 0.18);
        }

        .brand-icon {
            width: 62px;
            height: 62px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 17px;
            background: #55b9f3;
            color: white;
            font-size: 23px;
            font-weight: bold;
        }

        .brand-title {
            color: #1877b9;
            font-weight: bold;
        }

        .form-label {
            color: #25465c;
            font-weight: 600;
        }

        .form-control {
            padding: 12px;
            border: 1px solid #c6e6f8;
            border-radius: 10px;
        }

        .form-control:focus {
            border-color: #55b9f3;
            box-shadow: 0 0 0 0.2rem rgba(85, 185, 243, 0.2);
        }

        .login-button {
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #35a9ed;
            color: white;
            font-weight: bold;
        }

        .login-button:hover {
            background: #168bd0;
            color: white;
        }

        a {
            color: #168bd0;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .footer-text {
            color: #708b9c;
            font-size: 13px;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <main class="container px-3">
        <section class="login-card mx-auto">

            <div class="brand-icon">CI</div>

            <h1 class="brand-title text-center h3">
                Career Intelligence
            </h1>

            <p class="text-center text-secondary mb-4">
                Your journey to a brighter career starts here.
            </p>

            <form id="loginForm">

                <div class="mb-3">
                    <label for="email" class="form-label">
                        Email Address
                    </label>
                    <input
                        type="email"
                        id="email"
                        class="form-control"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">
                        Password
                    </label>
                    <input
                        type="password"
                        id="password"
                        class="form-control"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <div class="text-end mb-3">
                    <a href="#" id="forgotPassword">
                        Forgot password?
                    </a>
                </div>

                <button type="submit" class="btn login-button w-100">
                    Sign In
                </button>

                <p id="message"
                   class="text-center mt-3 mb-0"
                   role="status"
                   aria-live="polite">
                </p>

            </form>

            <hr class="my-4">

            <p class="footer-text text-center mb-0">
                AI-Powered Career Intelligence Platform
            </p>

        </section>
    </main>

    <script>
        // Demo only: real authentication is not connected.
        document.getElementById("loginForm").addEventListener(
            "submit",
            function(event) {
                event.preventDefault();
                document.getElementById("message").textContent =
                    "Login form ready! Authentication is not connected yet.";
            }
        );

        document.getElementById("forgotPassword").addEventListener(
            "click",
            function(event) {
                event.preventDefault();
                document.getElementById("message").textContent =
                    "Password recovery is not connected yet.";
            }
        );
    </script>

</body>
</html>
